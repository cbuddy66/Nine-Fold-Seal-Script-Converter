<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九叠篆 — Nine-Fold Seal Script Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121a;--panel:#1e1b27;--text:#efeaf6;--accent:#6d4aff;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif",serif;background:var(--bg);color:var(--text);padding:24px}
h1{font-size:1.4rem;margin:0 0 2px}
p.sub{margin:0 0 18px;color:#a89fc0;font-size:.9rem}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:.85rem;color:#c9c2db;display:block;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px}
textarea{width:100%;height:88px;background:#12101a;color:var(--text);border:1px solid #363047;
  border-radius:8px;padding:10px;font-size:1.25rem;font-family:"Noto Serif TC","Noto Serif",serif;resize:vertical}
select,input[type=range]{width:100%;accent-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:.95rem;cursor:pointer}
button:hover{filter:brightness(1.1)}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.examples button{background:#2c2740;font-size:.95rem;padding:6px 10px;font-family:"Noto Serif TC","Noto Serif",serif}
.exlist{font-size:.78rem;color:#8f86aa;line-height:1.7}
.exlist b{color:#c9c2db;font-weight:600;font-family:"Noto Serif TC","Noto Serif",serif}
#stage{background:var(--panel);border-radius:12px;padding:16px;min-height:300px;display:flex;align-items:center;justify-content:center}
#stage svg{width:100%;height:auto;max-height:72vh}
.legend{font-size:.82rem;color:#8f86aa;margin-top:10px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>九叠篆-generator</h1>
    <p class="sub">Traditionele Chinese tekens → nine-fold seal script</p>

    <div>
      <label for="inp">Tekens (traditioneel Chinees)</label>
      <textarea id="inp">永受嘉福</textarea>
    </div>

    <div class="examples">
      <button data-t="永受嘉福">永受嘉福</button>
      <button data-t="風調雨順">風調雨順</button>
      <button data-t="國泰民安">國泰民安</button>
      <button data-t="天子行寶">天子行寶</button>
      <button data-t="日">日</button>
    </div>
    <div class="exlist">
      <b>永受嘉福</b> — “Eeuwig ontvangen zegen en geluk”<br>
      <b>風調雨順</b> — “Gunstige wind en regen in het juiste seizoen”<br>
      <b>國泰民安</b> — “Het land welvarend, het volk in vrede”<br>
      <b>天子行寶</b> — “Zegel in gebruik door de Zoon des Hemels”<br>
      <b>日</b> — “Zon”
    </div>

    <div>
      <label for="foldMode">Vouwaantal (banen) per teken</label>
      <select id="foldMode">
        <option value="auto">Automatisch — naar tekencomplexiteit</option>
        <option value="manual">Handmatig</option>
      </select>
    </div>
    <input type="range" id="folds" min="3" max="13" value="9" disabled>

    <div>
      <label for="strokeW">Streekdikte: <span id="swLbl">10</span></label>
      <input type="range" id="strokeW" min="4" max="18" value="10">
    </div>

    <div>
      <label for="cols">Kolommen</label>
      <select id="cols">
        <option value="0">Automatisch (vierkant)</option>
        <option>1</option><option>2</option><option>3</option>
        <option selected>4</option><option>5</option><option>6</option>
      </select>
    </div>

    <div>
      <label for="style">Stijl</label>
      <select id="style">
        <option value="ink">Inkt op papier</option>
        <option value="zhu">朱文 — rood op wit</option>
        <option value="bai">白文 — wit op rood</option>
      </select>
    </div>

    <label class="chk"><input type="checkbox" id="frame" checked> Zegelframe tonen</label>
    <button id="dl">Download als PNG</button>
  </div>

  <div>
    <div id="stage"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var RASTER=512, MARGIN=4, CELL=120;
var GAP=RASTER*0.035, MINRUN=RASTER*0.018;
var SNAP=RASTER*0.045;   /* max afstand om een streekeinde te verlengen naar een ander uiteinde */
var JOIN=RASTER*0.075;   /* max tussenruimte om twee streekeinden aan elkaar te koppelen */
var XTOL=RASTER*0.045;   /* x-tolerantie voor het samenvoegen van verticale verbinders */
function $(id){return document.getElementById(id);}
var rCache=new Map(), pathCache=new Map();

/* ---------- Stap 1: rasteriseren + normaliseren tot vierkant ---------- */
function bboxFromData(d){
  var x0=RASTER,y0=RASTER,x1=-1,y1=-1;
  for(var y=0;y<RASTER;y++)for(var x=0;x<RASTER;x++){
    if(d[(y*RASTER+x)*4+3]>120){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  return x1<0?null:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
function rasterize(ch){
  var c=document.createElement("canvas");c.width=c.height=RASTER;
  var ctx=c.getContext("2d",{willReadFrequently:true});
  function font(f){return '700 '+f+'px "Noto Serif TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",serif';}
  ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font=font(Math.round(RASTER*0.82));
  ctx.fillText(ch,RASTER/2,RASTER/2+RASTER*0.04);
  var bb=bboxFromData(ctx.getImageData(0,0,RASTER,RASTER).data);
  if(!bb)return null;
  var sx=(RASTER-2*MARGIN)/bb.w, sy=(RASTER-2*MARGIN)/bb.h;
  ctx.clearRect(0,0,RASTER,RASTER);
  ctx.save();
  ctx.translate(MARGIN-bb.x*sx,MARGIN-bb.y*sy);
  ctx.scale(sx,sy);
  ctx.fillText(ch,RASTER/2,RASTER/2+RASTER*0.04);
  ctx.restore();
  var d=ctx.getImageData(0,0,RASTER,RASTER).data;
  var mask=new Uint8Array(RASTER*RASTER),ink=0,i;
  for(i=0;i<mask.length;i++){if(d[i*4+3]>120){mask[i]=1;ink++;}}
  return {mask:mask,density:ink/(RASTER*RASTER)};
}
function rasterOf(ch){
  if(!rCache.has(ch))rCache.set(ch,rasterize(ch));
  return rCache.get(ch);
}

/* ---------- Stap 5: adaptief vouwaantal ---------- */
function autoFolds(density){
  return Math.max(3,Math.min(13,Math.round(12-density*17)));
}

/* ---------- Stap 3: gelijke banen + Stap 2: kolomruns ---------- */
function buildSegments(mask,F){
  var bandH=RASTER/F,segs=[],b;
  for(b=0;b<F;b++){
    var y0=Math.floor(b*bandH),y1=Math.max(y0+1,Math.floor((b+1)*bandH));
    var has=new Uint8Array(RASTER),y,x;
    for(y=y0;y<y1;y++){var off=y*RASTER;for(x=0;x<RASTER;x++)if(mask[off+x])has[x]=1;}
    var runs=[],px=0;
    while(px<RASTER){
      if(has[px]){var s=px;while(px<RASTER&&has[px])px++;runs.push([s,px]);}
      else px++;
    }
    var merged=[];
    for(var r=0;r<runs.length;r++){
      if(merged.length&&runs[r][0]-merged[merged.length-1][1]<GAP)
        merged[merged.length-1][1]=runs[r][1];
      else merged.push([runs[r][0],runs[r][1]]);
    }
    var kept=merged.filter(function(rr){return rr[1]-rr[0]>=MINRUN;});
    segs.push(kept.map(function(rr){
      return {x1:rr[0],x2:rr[1],y:y0+bandH/2};
    }));
  }
  return segs;
}

/* ---------- Stap 4: vouwen, koppelen en doorlopen ---------- */
function buildGlyph(mask,F){
  var bandH=RASTER/F;
  var segs=buildSegments(mask,F);
  var b,i,j,e;

  /* verbinders tussen opeenvolgende banen; nabije losse einden aan elkaar koppelen */
  var connectors=[];
  for(b=0;b+1<F;b++){
    for(i=0;i<segs[b].length;i++){
      var s=segs[b][i];
      var bestOv=0,bi=-1,bestGap=Infinity,bj=-1;
      for(j=0;j<segs[b+1].length;j++){
        var t=segs[b+1][j];
        var ov=Math.min(s.x2,t.x2)-Math.max(s.x1,t.x1);
        if(ov>bestOv){bestOv=ov;bi=j;}
        var gp=(s.x2<t.x1)?(t.x1-s.x2):((t.x2<s.x1)?(s.x1-t.x2):0);
        if(gp<bestGap){bestGap=gp;bj=j;}
      }
      if(bi>=0&&bestOv>0){
        var tb=segs[b+1][bi];
        connectors.push({g:b,x:((b+i)%2===0)?Math.max(s.x1,tb.x1):Math.min(s.x2,tb.x2)});
      }else if(bj>=0&&bestGap<=JOIN){
        var tj=segs[b+1][bj],xj;
        if(s.x2<tj.x1){xj=(s.x2+tj.x1)/2;s.x2=xj;tj.x1=xj;}
        else{xj=(s.x1+tj.x2)/2;s.x1=xj;tj.x2=xj;}
        connectors.push({g:b,x:xj});
      }
    }
  }

  /* streekeinden doorlaten lopen tot een uiteinde van een streek in een andere baan */
  var ends=[];
  for(b=0;b<F;b++)for(i=0;i<segs[b].length;i++){
    ends.push({x:segs[b][i].x1,g:b});
    ends.push({x:segs[b][i].x2,g:b});
  }
  for(b=0;b<F;b++)for(i=0;i<segs[b].length;i++){
    var s2=segs[b][i],lx=-1,rx=-1;
    for(e=0;e<ends.length;e++){
      var en=ends[e];
      if(en.g!==b&&en.x<s2.x1&&s2.x1-en.x<=SNAP&&en.x>lx)lx=en.x;
      if(en.g!==b&&en.x>s2.x2&&en.x-s2.x2<=SNAP&&(rx<0||en.x<rx))rx=en.x;
    }
    if(lx>=0)s2.x1=lx;
    if(rx>=0)s2.x2=rx;
    /* uiteinden dicht bij de rand doorlopen tot de rand zelf */
    if(s2.x1<=SNAP)s2.x1=0;
    if(RASTER-s2.x2<=SNAP)s2.x2=RASTER;
  }

  /* verticale verbinders op dezelfde x samenvoegen en doorlaten lopen
     tot de middellijn van de dichtstbijzijnde streek erboven/onder,
     of tot de rand van het tekenvlak als de reeks in de buitenste baan zit */
  connectors.sort(function(a,c){return a.x-c.x;});
  var buckets=[],cur=null;
  for(i=0;i<connectors.length;i++){
    var cn=connectors[i];
    if(cur&&cn.x-cur.x/cur.n<=XTOL){
      cur.x+=cn.x;cur.n++;
      if(cn.g<cur.gMin)cur.gMin=cn.g;
      if(cn.g+1>cur.gMax)cur.gMax=cn.g+1;
    }else{
      cur={x:cn.x,n:1,gMin:cn.g,gMax:cn.g+1};
      buckets.push(cur);
    }
  }

  /* pad opbouwen: horizontale banen + verticale verbinders */
  var d="";
  for(b=0;b<F;b++)for(i=0;i<segs[b].length;i++){
    var s3=segs[b][i];
    d+="M"+s3.x1.toFixed(1)+" "+s3.y.toFixed(1)+"H"+s3.x2.toFixed(1);
  }
  for(i=0;i<buckets.length;i++){
    var bk=buckets[i],bx=bk.x/bk.n;
    var yTop=(bk.gMin===0)?0:(bk.gMin*bandH+bandH/2);
    var yBot=(bk.gMax===F)?RASTER:(bk.gMax*bandH-bandH/2);
    d+="M"+bx.toFixed(1)+" "+yTop.toFixed(1)+"V"+yBot.toFixed(1);
  }
  return d;
}

function glyph(ch,fmode,manualF){
  var r=rasterOf(ch);
  if(!r)return null;
  var folds=(fmode==="manual")?manualF:autoFolds(r.density);
  var key=ch+"|"+folds;
  if(!pathCache.has(key))pathCache.set(key,buildGlyph(r.mask,folds));
  return {paths:pathCache.get(key),folds:folds};
}

/* ---------- Renderen naar SVG-zegel ---------- */
function render(){
  var raw=$("inp").value||"";
  var chars=[];
  for(var i=0;i<raw.length;i++){
    var c=raw.charAt(i);
    if(/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\u3007]/.test(c)&&chars.indexOf(c)<0)chars.push(c);
  }
  if(!chars.length){
    $("stage").innerHTML='<p style="color:#8f86aa">Typ traditionele Chinese tekens…</p>';
    $("legend").textContent="";
    return;
  }
  var colsOpt=parseInt($("cols").value,10);
  var cols=colsOpt||Math.ceil(Math.sqrt(chars.length));
  var rows=Math.ceil(chars.length/cols);
  var W=cols*CELL,H=rows*CELL,k=CELL/RASTER;
  var sel=$("style").value,bg,fg;
  if(sel==="ink"){bg="#faf6ec";fg="#17141a";}
  else if(sel==="zhu"){bg="#faf6ec";fg="#b3271e";}
  else{bg="#b3271e";fg="#faf6ec";}
  var swRaster=parseInt($("strokeW").value,10), swSvg=swRaster*k;
  var fmode=$("foldMode").value, manualF=parseInt($("folds").value,10);

  /* frame-geometrie en bijbehorende clip: tekens lopen door tot het
     binnenste van het frame, incl. afgeronde hoeken */
  var showFrame=$("frame").checked;
  var fw=Math.max(2.5,swSvg*1.4);
  var fi=fw;                       /* middellijn van de frame-stroke */
  var clipInset=Math.max(0,fi-fw/2);
  var CR=12;                       /* hoekstraal van het frame */
  var clipR=Math.max(0,CR-fw/2);

  var defs="",groups="",legend=[];
  var clipId="sealclip";
  defs='<clipPath id="'+clipId+'"><rect x="'+clipInset.toFixed(2)+'" y="'+clipInset.toFixed(2)+
       '" width="'+(W-2*clipInset).toFixed(2)+'" height="'+(H-2*clipInset).toFixed(2)+
       '" rx="'+clipR.toFixed(2)+'"/></clipPath>';

  for(i=0;i<chars.length;i++){
    var g=glyph(chars[i],fmode,manualF);
    var cx=(i%cols)*CELL,cy=Math.floor(i/cols)*CELL;
    if(g){
      groups+='<g transform="translate('+cx+','+cy+') scale('+k+')" fill="none" stroke="'+fg+
              '" stroke-width="'+swRaster+'" stroke-linecap="round" stroke-linejoin="round">'+
              '<path d="'+g.paths+'"/></g>';
      legend.push(chars[i]+" · "+g.folds+" banen");
    }else legend.push(chars[i]+" · —");
  }

  var frame="";
  if(showFrame){
    frame='<rect x="'+fi.toFixed(2)+'" y="'+fi.toFixed(2)+'" width="'+(W-2*fi).toFixed(2)+
          '" height="'+(H-2*fi).toFixed(2)+'" fill="none" stroke="'+fg+
          '" stroke-width="'+fw.toFixed(2)+'" rx="'+CR+'"/>';
  }

  $("stage").innerHTML=
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+
    '" width="'+(W*2)+'" height="'+(H*2)+'">'+
    '<defs>'+defs+'</defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="'+bg+'"/>'+
    '<g clip-path="url(#'+clipId+)">'+groups+'</g>'+
    frame+'</svg>';
  $("legend").textContent=legend.join("  ·  ");
}

/* ---------- PNG-export ---------- */
function download(){
  var svg=$("stage").querySelector("svg");
  if(!svg)return;
  var xml='<?xml version="1.0" encoding="UTF-8"?>\n'+
          new XMLSerializer().serializeToString(svg);
  var blob=new Blob([xml],{type:"image/svg+xml;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var img=new Image();
  img.onload=function(){
    try{
      var vb=svg.viewBox.baseVal;
      var c=document.createElement("canvas");
      c.width=Math.min(4096,Math.round(vb.width*5));
      c.height=Math.round(c.width*vb.height/vb.width);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var a=document.createElement("a");
      if(c.toBlob){
        c.toBlob(function(b){
          var dl=URL.createObjectURL(b);
          a.href=dl;a.download="jiudiezhuan-zegel.png";
          document.body.appendChild(a);a.click();
          document.body.removeChild(a);
          setTimeout(function(){URL.revokeObjectURL(dl);},500);
        },"image/png");
      }else{
        a.href=c.toDataURL("image/png");
        a.download="jiudiezhuan-zegel.png";
        document.body.appendChild(a);a.click();
        document.body.removeChild(a);
      }
    }catch(err){
      alert("Exporteren mislukt: "+err.message);
    }finally{
      URL.revokeObjectURL(url);
    }
  };
  img.onerror=function(){
    URL.revokeObjectURL(url);
    alert("De afbeelding kon niet worden gegenereerd.");
  };
  img.src=url;
}

/* ---------- Events ---------- */
$("inp").addEventListener("input",render);

$("foldMode").addEventListener("change",function(){
  $("folds").disabled=($("foldMode").value!=="manual");
  render();
});
$("folds").addEventListener("input",render);

$("strokeW").addEventListener("input",function(){
  $("swLbl").textContent=$("strokeW").value;
  render();
});

$("cols").addEventListener("change",render);
$("style").addEventListener("change",render);
$("frame").addEventListener("change",render);
$("dl").addEventListener("click",download);

var exButtons=document.querySelectorAll(".examples button");
for(var i=0;i<exButtons.length;i++){
  (function(btn){
    btn.addEventListener("click",function(){
      $("inp").value=btn.getAttribute("data-t");
      render();
    });
  })(exButtons[i]);
}

render();
})();
</script>
</body>
</html>
