<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九叠篆 — Nine-Fold Seal Script Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14121a;--panel:#1e1b27;--text:#efeaf6;--accent:#6d4aff;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Serif",serif;background:var(--bg);color:var(--text);padding:24px}
h1{font-size:1.4rem;margin:0 0 2px}
p.sub{margin:0 0 18px;color:#a89fc0;font-size:.9rem}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:330px 1fr;gap:20px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:.85rem;color:#c9c2db;display:block;margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px}
textarea{width:100%;height:88px;background:#12101a;color:var(--text);border:1px solid #363047;
  border-radius:8px;padding:10px;font-size:1.25rem;font-family:"Noto Serif TC","Noto Serif",serif;resize:vertical}
select,input[type=range]{width:100%;accent-color:var(--accent)}
button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:.95rem;cursor:pointer}
button:hover{filter:brightness(1.1)}
.examples{display:flex;flex-wrap:wrap;gap:6px}
.examples button{background:#2c2740;font-size:.85rem;padding:6px 10px;font-family:"Noto Serif TC",serif}
#stage{background:var(--panel);border-radius:12px;padding:16px;min-height:300px;display:flex;align-items:center;justify-content:center}
#stage svg{width:100%;height:auto;max-height:72vh}
.legend{font-size:.82rem;color:#8f86aa;margin-top:10px;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>九叠篆-generator</h1>
    <p class="sub">Traditionele Chinese tekens → nine-fold seal script</p>

    <div>
      <label for="inp">Tekens (traditioneel Chinees)</label>
      <textarea id="inp">永受嘉福</textarea>
    </div>

    <div class="examples">
      <button data-t="永受嘉福">永受嘉福</button>
      <button data-t="風調雨順">風調雨順</button>
      <button data-t="國泰民安">國泰民安</button>
      <button data-t="天子行寶">天子行寶</button>
      <button data-t="日">日</button>
    </div>

    <div>
      <label for="foldMode">Vouwaantal (banen) per teken</label>
      <select id="foldMode">
        <option value="auto">Automatisch — naar tekencomplexiteit</option>
        <option value="manual">Handmatig</option>
      </select>
    </div>
    <input type="range" id="folds" min="3" max="13" value="9" disabled>

    <div>
      <label for="strokeW">Streekdikte: <span id="swLbl">10</span></label>
      <input type="range" id="strokeW" min="4" max="18" value="10">
    </div>

    <div>
      <label for="cols">Kolommen</label>
      <select id="cols">
        <option value="0">Automatisch (vierkant)</option>
        <option>1</option><option>2</option><option>3</option>
        <option selected>4</option><option>5</option><option>6</option>
      </select>
    </div>

    <div>
      <label for="style">Stijl</label>
      <select id="style">
        <option value="ink">Inkt op papier</option>
        <option value="zhu">朱文 — rood op wit</option>
        <option value="bai">白文 — wit op rood</option>
      </select>
    </div>

    <label class="chk"><input type="checkbox" id="frame" checked> Zegelframe tonen</label>
    <button id="dl">Download als PNG</button>
  </div>

  <div>
    <div id="stage"></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
(function(){
"use strict";
const RASTER=512, MARGIN=12, CELL=120;
const GAP=RASTER*0.035, MINRUN=RASTER*0.018;
const $=id=>document.getElementById(id);
const rCache=new Map(), pathCache=new Map();

/* ---------- Stap 1: rasteriseren + normaliseren tot vierkant ---------- */
function bboxFromData(d){
  let x0=RASTER,y0=RASTER,x1=-1,y1=-1;
  for(let y=0;y<RASTER;y++)for(let x=0;x<RASTER;x++){
    if(d[(y*RASTER+x)*4+3]>120){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  return x1<0?null:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
function rasterize(ch){
  const c=document.createElement("canvas");c.width=c.height=RASTER;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  const font=f=>'700 '+f+'px "Noto Serif TC","PingFang TC","Microsoft JhengHei","Noto Sans TC",serif';
  ctx.fillStyle="#000";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font=font(Math.round(RASTER*0.82));
  ctx.fillText(ch,RASTER/2,RASTER/2+RASTER*0.04);
  const bb=bboxFromData(ctx.getImageData(0,0,RASTER,RASTER).data);
  if(!bb)return null;
  /* uitrekken zodat het teken exact het vierkant vult */
  const sx=(RASTER-2*MARGIN)/bb.w, sy=(RASTER-2*MARGIN)/bb.h;
  ctx.clearRect(0,0,RASTER,RASTER);
  ctx.save();
  ctx.translate(MARGIN-bb.x*sx,MARGIN-bb.y*sy);
  ctx.scale(sx,sy);
  ctx.fillText(ch,RASTER/2,RASTER/2+RASTER*0.04);
  ctx.restore();
  const d=ctx.getImageData(0,0,RASTER,RASTER).data;
  const mask=new Uint8Array(RASTER*RASTER);let ink=0;
  for(let i=0;i<mask.length;i++){if(d[i*4+3]>120){mask[i]=1;ink++;}}
  return {mask,density:ink/(RASTER*RASTER)};
}
function rasterOf(ch){if(!rCache.has(ch))rCache.set(ch,rasterize(ch));return rCache.get(ch);}

/* ---------- Stap 5: adaptief vouwaantal ---------- */
function autoFolds(density){
  return Math.max(3,Math.min(13,Math.round(12-density*17)));
}

/* ---------- Stap 3: gelijke banen + Stap 2: kolomruns ---------- */
function buildSegments(mask,F){
  const bandH=RASTER/F,segs=[];
  for(let b=0;b<F;b++){
    const y0=Math.floor(b*bandH),y1=Math.max(y0+1,Math.floor((b+1)*bandH));
    const has=new Uint8Array(RASTER);
    for(let y=y0;y<y1;y++){const off=y*RASTER;for(let x=0;x<RASTER;x++)if(mask[off+x])has[x]=1;}
    const runs=[];let x=0;
    while(x<RASTER){if(has[x]){const s=x;while(x<RASTER&&has[x])x++;runs.push([s,x]);}else x++;}
    const merged=[];
    for(const r of runs){
      if(merged.length&&r[0]-merged[merged.length-1][1]<GAP)merged[merged.length-1][1]=r[1];
      else merged.push([r[0],r[1]]);
    }
    const kept=merged.filter(r=>r[1]-r[0]>=MINRUN);
    segs.push(kept.map(r=>({x1:r[0],x2:r[1],y:y0+bandH/2})));
  }
  return segs;
}

/* ---------- Stap 4: vouwen (afwisselende verbinders) ---------- */
function buildPaths(segs){
  const p=[];
  for(let b=0;b<segs.length;b++){
    for(const s of segs[b])p.push("M"+s.x1.toFixed(1)+" "+s.y.toFixed(1)+"H"+s.x2.toFixed(1));
    if(b+1<segs.length){
      for(let i=0;i<segs[b].length;i++){
        const s=segs[b][i];let best=null,ov=0;
        for(const t of segs[b+1]){
          const o=Math.min(s.x2,t.x2)-Math.max(s.x1,t.x1);
          if(o>ov){ov=o;best=t;}
        }
        if(best){
          const x=((b+i)%2===0)?Math.max(s.x1,best.x1):Math.min(s.x2,best.x2);
          p.push("M"+x.toFixed(1)+" "+s.y.toFixed(1)+"V"+best.y.toFixed(1));
        }
      }
    }
  }
  return p.join("");
}
function glyph(ch,fmode,manualF){
  const r=rasterOf(ch); if(!r)return null;
  const folds=fmode==="manual"?manualF:autoFolds(r.density);
  const key=ch+"|"+folds;
  if(!pathCache.has(key))pathCache.set(key,buildPaths(buildSegments(r.mask,folds)));
  return {paths:pathCache.get(key),folds:folds};
}

/* ---------- Renderen naar SVG-zegel ---------- */
function render(){
  const chars=[...$("inp").value].filter(c=>/[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\u3007]/.test(c));
  if(!chars.length){
    $("stage").innerHTML='<p style="color:#8f86aa">Typ traditionele Chinese tekens…</p>';
    $("legend").textContent="";return;
  }
  const colsOpt=parseInt($("cols").value,10);
  const cols=colsOpt||Math.ceil(Math.sqrt(chars.length));
  const rows=Math.ceil(chars.length/cols);
  const W=cols*CELL,H=rows*CELL,k=CELL/RASTER;
  const sel=$("style").value;
  let bg,fg;
  if(sel==="ink"){bg="#faf6ec";fg="#17141a";}
  else if(sel==="zhu"){bg="#faf6ec";fg="#b3271e";}
  else{bg="#b3271e";fg="#faf6ec";}
  const swRaster=+$("strokeW").value, swSvg=swRaster*k;
  const fmode=$("foldMode").value, manualF=+$("folds").value;
  let groups="",legend=[];
  for(let i=0;i<chars.length;i++){
    const g=glyph(chars[i],fmode,manualF);
    const cx=(i%cols)*CELL,cy=Math.floor(i/cols)*CELL;
    if(g){
      groups+='<g transform="translate('+cx+','+cy+') scale('+k+')" fill="none" stroke="'+fg+
              '" stroke-width="'+swRaster+'" stroke-linecap="square"><path d="'+g.paths+'"/></g>';
      legend.push(chars[i]+" · "+g.folds+" banen");
    }else legend.push(chars[i]+" · —");
  }
  let frame="";
  if($("frame").checked){
    const inset=Math.max(3,swSvg*0.9);
    frame='<rect x="'+inset+'" y="'+inset+'" width="'+(W-2*inset)+'" height="'+(H-2*inset)+
          '" fill="none" stroke="'+fg+'" stroke-width="'+(swSvg*1.6)+'" rx="10"/>';
  }
  $("stage").innerHTML=
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" width="'+(W*2)+'" height="'+(H*2)+'">'+
    '<rect width="'+W+'" height="'+H+'" fill="'+bg+'"/>'+frame+groups+'</svg>';
  $("legend").textContent=legend.join("  ·  ");
}

/* ---------- PNG-export ---------- */
function download(){
  const svg=$("stage").querySelector("svg");if(!svg)return;
  const xml=new XMLSerializer().serializeToString(svg);
  const url=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml;charset=utf-8"}));
  const img=new Image();
  img.onload=function(){
    const vb=svg.viewBox.baseVal;
    const c=document.createElement("canvas");
    c.width=Math.min(4096,vb.width*5);c.height=c.width*vb.height/vb.width;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(function(b){
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);a.download="jiudiezhuan-zegel.png";a.click();
    });
  };
  img.src=url;
}

/* ---------- Events ----------
